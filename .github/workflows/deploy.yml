# GitHub Actions → SSH deploy to self-hosted CentOS server
# GitHub Actions 经 SSH 部署到自有 CentOS 服务器（方案 A）
#
# Required Secrets / 必填 Secrets:
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT
# Optional / 可选:
#   DEPLOY_PATH (default /opt/erp_demo), DEPLOY_BRANCH (default main)
#
# Production auto-deploy listens on push to main only.
# 生产自动部署仅监听 push 到 main；feature 分支请用 workflow_dispatch 手动跑。

name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        # 中文：通过 SSH 在服务器执行 deploy.sh（拉取、编译、重启）
        # English: Run deploy.sh on the server via SSH (pull, build, restart)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # script_stop removed: not supported by appleboy/ssh-action@v1.2.2
          # script_stop 已移除：当前 action 版本不支持该输入
          command_timeout: 25m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/erp_demo"
            fi
            BRANCH="${{ secrets.DEPLOY_BRANCH }}"
            if [ -z "$BRANCH" ]; then
              BRANCH="main"
            fi
            echo "Deploy path: $DEPLOY_PATH"
            echo "Branch: $BRANCH"
            test -d "$DEPLOY_PATH/.git"
            # Sync git BEFORE deploy.sh so a dirty server tree cannot block the first update.
            # 先强制对齐远程，避免服务器上旧版 deploy.sh 因本地修改无法 checkout。
            # Ignored files (.env, .venv) are kept (no git clean -x).
            # 忽略文件（.env、.venv）会保留（不使用 git clean -x）。
            cd "$DEPLOY_PATH"
            git fetch origin
            git reset --hard HEAD || true
            git checkout -f "$BRANCH"
            git reset --hard "origin/$BRANCH"
            test -x "$DEPLOY_PATH/deploy/deploy.sh" || chmod +x "$DEPLOY_PATH/deploy/deploy.sh"
            DEPLOY_PATH="$DEPLOY_PATH" BRANCH="$BRANCH" bash "$DEPLOY_PATH/deploy/deploy.sh"
